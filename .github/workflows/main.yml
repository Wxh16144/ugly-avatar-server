name: Create and publish a Docker image

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      tag:
        description: "Build version number"
        required: true
        type: string
      isLatest:
        description: "Whether to tag as latest"
        required: false
        type: boolean
        default: false
  # 推送 tag 时自动触发 (例如 git push origin v1.0.0)
  push:
    tags:
      - 'v*'

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: wxh16144
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: wxh16144/ugly-avatar-server
          tags: |
            # 手动触发: 使用输入的 tag
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # 手动触发: 如果 isLatest 为 true，则添加 latest 标签
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.isLatest == 'true' }}
            # Git Tag 触发: 使用 git tag 名称 (例如 v1.0.0)
            type=ref,event=tag
            # Git Tag 触发: 默认同时也打上 latest 标签
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
